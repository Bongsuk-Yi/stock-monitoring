name: AI 리포트 요청

on:
  workflow_dispatch:
    inputs:
      code:
        description: '종목 코드 (한국 6자리 예: 005930 / 미국 티커 예: NVDA)'
        required: true
        type: string
      language:
        description: '리포트 언어'
        type: choice
        options: [ko, en]
        default: ko

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-report
  cancel-in-progress: false

env:
  PRISM_REPO: dragon1086/prism-insight
  PRISM_REF: a426de8e1f6d06c1bef2f57255a672ec11337303   # 검증한 원본 버전(바꾸면 새 버전 사용)

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      KIS_ACCOUNT: ${{ secrets.KIS_ACCOUNT }}
      KIS_HTS_ID: ${{ secrets.KIS_HTS_ID }}
      PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      REPORT_MODEL: ${{ vars.REPORT_MODEL }}
    steps:
      - uses: actions/checkout@v5

      - name: 종목 확인
        id: t
        env:
          CODE_IN: ${{ inputs.code }}
        run: |
          code="$(echo "$CODE_IN" | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
          if [[ "$code" =~ ^[0-9A-Z]{6}$ && "$code" =~ [0-9] ]]; then market=KR
            name="$(curl -fsS -A 'Mozilla/5.0' "https://m.stock.naver.com/api/stock/${code}/basic" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("stockName",""))' || true)"
          elif [[ "$code" =~ ^[A-Z.\-]{1,10}$ ]]; then market=US
            name="$(python3 -c 'import json,urllib.request,sys;r=urllib.request.Request("https://query1.finance.yahoo.com/v1/finance/search?q='"$code"'&quotesCount=1",headers={"User-Agent":"Mozilla/5.0"});q=json.load(urllib.request.urlopen(r))["quotes"];print((q[0].get("longname") or q[0].get("shortname")) if q else "")' || true)"
          else echo "::error::종목 코드 형식이 아닙니다: $CODE_IN"; exit 1; fi
          [ -z "$name" ] && name="$code"
          echo "market=$market" >> "$GITHUB_OUTPUT"; echo "code=$code" >> "$GITHUB_OUTPUT"; echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### $name ($code · $market) 리포트 생성" >> "$GITHUB_STEP_SUMMARY"

      - name: PRISM-INSIGHT 받기
        uses: actions/checkout@v5
        with:
          repository: ${{ env.PRISM_REPO }}
          ref: ${{ env.PRISM_REF }}
          path: prism

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: prism/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6

      - name: 설정 파일 만들기
        working-directory: prism
        run: |
          pip install -q pyyaml
          python ../scripts/report/configure.py ${{ steps.t.outputs.market }}

      - name: 의존성 설치
        working-directory: prism
        run: |
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: AI 분석 (5~15분)
        working-directory: prism
        run: python ../scripts/report/run_report.py --market "${{ steps.t.outputs.market }}" --code "${{ steps.t.outputs.code }}" --name "${{ steps.t.outputs.name }}" --lang "${{ inputs.language }}" --out ../out

      - name: 암호화해서 reports 브랜치에 저장
        run: |
          git fetch origin reports --depth=1 && git worktree add rep origin/reports || { git worktree add --detach rep && (cd rep && git checkout --orphan reports-new && git rm -rfq . ); }
          node scripts/report/publish.mjs out rep
          cd rep
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "report ${{ steps.t.outputs.code }} $(TZ=Asia/Seoul date '+%F %T')"
          git push origin HEAD:reports
          echo "완료 — 사이트에 몇 분 안에 반영됩니다" >> "$GITHUB_STEP_SUMMARY"

      - name: 사이트 다시 배포 (수집 없이)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml -R ${{ github.repository }} -f collect=false
