name: Collect & Deploy

on:
  schedule:
    - cron: '37 7 * * 1-5'     # 평일 16:37 KST (장 마감 뒤)
    - cron: '17 10 * * 1-5'    # 평일 19:17 KST (외국인·기관 확정치 반영)
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collect:
        description: '자료 수집도 실행'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 이전 수집 자료 가져오기 (data 브랜치)
        run: |
          git fetch origin data --depth=1 || true
          git show origin/data:store.enc.json > store.enc.json 2>/dev/null || rm -f store.enc.json
          ls -la store.enc.json 2>/dev/null || echo "이전 자료 없음 — 처음부터 수집합니다"

      - name: 수집
        if: github.event_name != 'workflow_dispatch' || inputs.collect == true || hashFiles('store.enc.json') == ''
        run: node scripts/collect.mjs store.enc.json

      - name: 수집 자료 저장 (data 브랜치)
        if: hashFiles('store.enc.json') != ''
        run: |
          mkdir -p /tmp/d && cp store.enc.json /tmp/d/
          cd /tmp/d && git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add store.enc.json && git commit -qm "data $(TZ=Asia/Seoul date '+%F %T')"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: AI 리포트 가져오기 (reports 브랜치)
        run: |
          mkdir -p reports
          if git fetch origin reports --depth=1; then git archive origin/reports | tar -x -C reports; fi
          ls reports | head

      - run: node scripts/build.mjs store.enc.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
