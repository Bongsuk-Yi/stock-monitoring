name: naver-selftest
on:
  push:
    paths: ['.github/workflows/naver-selftest.yml']
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      PRISM_REF: a426de8e1f6d06c1bef2f57255a672ec11337303
      OPENAI_API_KEY: sk-dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: dragon1086/prism-insight, ref: '${{ env.PRISM_REF }}', path: prism }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: prism/requirements.txt }
      - working-directory: prism
        run: |
          pip install -q -r requirements.txt
          python ../scripts/report/configure.py KR
          echo "--- MCP env:"; python -c "import yaml;print(yaml.safe_load(open('mcp_agent.config.yaml'))['mcp']['servers']['kospi_kosdaq'])"
          echo "--- GITHUB_ENV:"; cat "$GITHUB_ENV" | grep NAVER
          grep -c "원천: 네이버 증권" prism_core/kr_flow_evidence.py
      - working-directory: prism
        run: python ../scripts/report/test_naver.py 035420 2>&1 | grep -E "체인 기능|flow_evidence_public"
