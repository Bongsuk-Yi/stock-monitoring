name: naver-selftest
on:
  push:
    paths: ['.github/workflows/naver-selftest.yml', 'scripts/report/**']
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      PRISM_REF: a426de8e1f6d06c1bef2f57255a672ec11337303
      OPENAI_API_KEY: sk-dummy
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: dragon1086/prism-insight, ref: '${{ env.PRISM_REF }}', path: prism }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: prism/requirements.txt }
      - working-directory: prism
        run: |
          pip install -q -r requirements.txt
          python ../scripts/report/install_naver.py
          tail -6 cores/market_data/__init__.py
          PRISM_NAVER_SOURCE=1 python ../scripts/report/test_naver.py 005930
