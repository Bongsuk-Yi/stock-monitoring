name: report-selftest
on:
  push:
    paths: ['.github/workflows/report-selftest.yml']
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    env:
      PRISM_REF: a426de8e1f6d06c1bef2f57255a672ec11337303
      OPENAI_API_KEY: sk-dummy
      KIS_APP_KEY: dummy
      KIS_APP_SECRET: dummy
      KIS_ACCOUNT: '1234567801'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with: { repository: dragon1086/prism-insight, ref: '${{ env.PRISM_REF }}', path: prism }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: prism/requirements.txt }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: astral-sh/setup-uv@v6
      - working-directory: prism
        run: |
          pip install -q pyyaml && python ../scripts/report/configure.py KR
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium
          python -c "import cores.analysis, report_generator; print('IMPORT OK')"
          python ../scripts/report/run_report.py --help | head -3
          head -c 300 trading/config/kis_devlp.yaml | sed 's/dummy/***/g'
      - name: 종목 이름 조회 시험
        run: curl -fsS -A 'Mozilla/5.0' https://m.stock.naver.com/api/stock/005930/basic | python3 -c 'import sys,json;print("name:",json.load(sys.stdin).get("stockName"))'
